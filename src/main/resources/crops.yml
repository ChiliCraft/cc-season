  KELP: {spring: 1.10, summer: 1.20, autumn: 0.80, winter: 0.40}
  CHORUS_FLOWER: {spring: 1.00, summer: 1.10, autumn: 0.60, winter: 0.00}
  CAVE_VINES: {spring: 1.00, summer: 0.90, autumn: 0.90, winter: 0.60}
  TWISTING_VINES: {spring: 1.00, summer: 1.00, autumn: 0.80, winter: 0.60}
  WEEPING_VINES: {spring: 1.00, summer: 1.00, autumn: 0.80, winter: 0.60}
  RED_MUSHROOM: {spring: 0.90, summer: 0.60, autumn: 1.20, winter: 0.30}
  BROWN_MUSHROOM: {spring: 0.90, summer: 0.60, autumn: 1.20, winter: 0.30}
