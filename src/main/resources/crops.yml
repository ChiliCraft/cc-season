# 生长修正：对上面 rates 的结果统一乘算（温室内的作物不参与修正）
growth:
  # 雨天生长率倍率，1.0 表示无加成
  rain-growth-bonus: 1.0
  # 作物当前季节没有配置条目时，仍允许原版生长的概率
  off-season-growth-chance: 0.10
  # 光照低于该值（0-15）按低光倍率折算
  required-light: 4
  low-light-multiplier: 0.70
  # 无天空光照（地下）时的倍率
  underground-multiplier: 0.80
greenhouse:
  enabled: true
  # 温室判定（两种满足其一即受保护）：
  # ① 屋顶模式：作物上方 1..max-roof-height 格同一柱内出现玻璃；
  # ② 体积模式：以作物为心、水平 ±radius、高 max-roof-height 的体积内玻璃方块数 >= min-glass-count
  radius: 7
  min-glass-count: 16
  # 体积扫描与屋顶检测的最大层高
  max-roof-height: 4
  # 可计入的玻璃类型（材料名）
  block-types: [GLASS, WHITE_STAINED_GLASS, LIGHT_BLUE_STAINED_GLASS]
  # 要求判定体积内存在 core-block 才计入温室（默认关）
  require-core: false
  core-block: GLASS
  # 温室内冬季生长倍率（1.0 = 与其他季节一致）
  winter-bonus: 1.0
  debug:
    # 手持该物品右键作物显示温室判定统计
    stick: STICK
