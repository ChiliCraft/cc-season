name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      # 附属模块 compileOnly 依赖 cc-core：就地检出并发布到 mavenLocal 供本仓解析。
      # cc-core 仓发布 GitHub Packages（打 tag）后，也可改用 Packages 拉取，省去此步。
      - name: 检出 cc-core 并发布到 mavenLocal
        uses: actions/checkout@v4
        with:
          repository: ChiliCraft/cc-core
          path: .cc-core-src

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 cc-core 并发布到 mavenLocal
        run: sh gradlew -p .cc-core-src publishToMavenLocal --no-daemon

      - name: 构建
        run: sh gradlew build --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cc-season
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
